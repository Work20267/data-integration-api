name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC federated auth to Azure

# Never let two deploys race to the same environment.
concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: >
          dotnet publish src/DataIntegration.Api/DataIntegration.Api.csproj
          --configuration Release --output ./publish

      # Produced before anything is deployed, and uploaded as an artifact, so the
      # exact DDL that will run against production is reviewable after the fact.
      # --idempotent means re-running it is a no-op rather than an error.
      - name: Generate idempotent migration script
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations script \
            --idempotent \
            --project src/DataIntegration.Infrastructure \
            --startup-project src/DataIntegration.Api \
            --output ./migrations.sql
          echo "### Migration script" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          head -40 ./migrations.sql >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: migrations-sql
          path: ./migrations.sql
          retention-days: 30

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infra
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: infra/dev.bicepparam
          failOnStdErr: false

      # Schema goes first: the new code must never start against an old schema.
      # Authentication=Active Directory Default picks up the OIDC session from
      # azure/login, so no SQL password exists in this pipeline either.
      - name: Apply migrations
        uses: azure/sql-action@v2
        with:
          connection-string: >-
            Server=tcp:${{ steps.infra.outputs.sqlServerFqdn }},1433;
            Initial Catalog=${{ steps.infra.outputs.sqlDatabaseName }};
            Authentication=Active Directory Default;
            Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;
          path: ./migrations.sql

      - name: Deploy application
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.appServiceName }}
          package: ./publish

      # The Phase 1 gate. A cold F1 instance can take a while to answer.
      - name: Smoke test /health
        run: |
          URL="${{ steps.infra.outputs.appServiceUrl }}/health"
          echo "Probing $URL"
          for attempt in $(seq 1 12); do
            CODE=$(curl -fsS -o /tmp/body -w '%{http_code}' "$URL" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s): $(cat /tmp/body)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${CODE} - retrying in 15s"
            sleep 15
          done
          echo "::error::/health never returned 200 - failing the deployment"
          exit 1

      # Readiness is reported but not gated on: Azure SQL serverless may still be
      # resuming from an auto-pause, which is not a deployment failure.
      - name: Report readiness
        if: success()
        run: |
          URL="${{ steps.infra.outputs.appServiceUrl }}/health/ready"
          CODE=$(curl -s -o /tmp/ready -w '%{http_code}' "$URL" || echo "000")
          echo "readiness: HTTP ${CODE} $(cat /tmp/ready 2>/dev/null)"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| Resource | Value |"
            echo "| --- | --- |"
            echo "| App Service | \`${{ steps.infra.outputs.appServiceName }}\` |"
            echo "| URL | ${{ steps.infra.outputs.appServiceUrl }} |"
            echo "| SQL Server | \`${{ steps.infra.outputs.sqlServerFqdn }}\` |"
            echo "| Database | \`${{ steps.infra.outputs.sqlDatabaseName }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1036 378" width="1036" height="378"
  role="img" aria-label="Credential path: GitHub Actions authenticates to Azure Resource Manager with an OIDC federated credential; Resource Manager provisions and deploys to App Service; App Service authenticates to Azure SQL with a user-assigned managed identity. No client secret, publish profile, or SQL admin password is stored anywhere.">
  <defs>
    <style>
      .bg   { fill: #FFFFFF; stroke: #D3DAE0; stroke-width: 1; }
      .eyb  { fill: #0E7C86; font: 500 10px "IBM Plex Mono","Cascadia Mono",Consolas,monospace; letter-spacing: 1.4px; }
      .ttl  { fill: #101820; font: 600 17px "Archivo","Segoe UI",system-ui,sans-serif; }
      .foot { fill: #79868F; font: 400 10px "IBM Plex Mono","Cascadia Mono",Consolas,monospace; }
      .box   { fill: #FFFFFF; stroke: #D3DAE0; stroke-width: 1.2; }
      .arw   { fill: none; stroke: #4A5660; stroke-opacity: .6; stroke-width: 1.3; }
      .arw-a { fill: none; stroke: #0E7C86; stroke-width: 1.5; }
      .job   { fill: #101820; font: 500 12px "IBM Plex Mono","Cascadia Mono",Consolas,monospace; }
      .sub   { fill: #79868F; font: 400 10px "IBM Plex Mono","Cascadia Mono",Consolas,monospace; }
      .lbl   { fill: #4A5660; font: 400 10px "IBM Plex Mono","Cascadia Mono",Consolas,monospace; }
      .gone  { fill: none; stroke: #D3DAE0; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .gone-t{ fill: #79868F; font: 400 10px "IBM Plex Mono","Cascadia Mono",Consolas,monospace; }
      .strike{ stroke: #79868F; stroke-width: 1.2; stroke-opacity: .9; }
    </style>
    <marker id="cr-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon fill="#0E7C86" points="0,1 10,5 0,9" />
    </marker>
    <marker id="cr-arw-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon fill="#4A5660" points="0,1 10,5 0,9" />
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1035" height="377" rx="4" />
  <text class="eyb" x="28" y="26">CREDENTIAL PATH</text>
  <text class="ttl" x="28" y="49">Two hops, zero passwords</text>

  <g transform="translate(28,64)">
    <rect class="box" x="16" y="62" width="160" height="80" rx="5" />
    <text class="job" x="96" y="98" text-anchor="middle">GitHub Actions</text>
    <text class="sub" x="96" y="118" text-anchor="middle">ubuntu-latest</text>

    <rect class="box" x="276" y="62" width="160" height="80" rx="5" />
    <text class="job" x="356" y="92" text-anchor="middle">Azure</text>
    <text class="job" x="356" y="110" text-anchor="middle">Resource Mgr</text>
    <text class="sub" x="356" y="130" text-anchor="middle">rg-di-dev</text>

    <rect class="box" x="536" y="62" width="160" height="80" rx="5" />
    <text class="job" x="616" y="98" text-anchor="middle">App Service</text>
    <text class="sub" x="616" y="118" text-anchor="middle">user-assigned MI</text>

    <rect class="box" x="796" y="62" width="160" height="80" rx="5" />
    <text class="job" x="876" y="98" text-anchor="middle">Azure SQL</text>
    <text class="sub" x="876" y="118" text-anchor="middle">Entra-only auth</text>

    <line class="arw-a" x1="176" y1="102" x2="268" y2="102" marker-end="url(#cr-arw)" />
    <text class="lbl" x="222" y="92" text-anchor="middle">OIDC token</text>
    <text class="gone-t" x="222" y="120" text-anchor="middle">federated</text>

    <line class="arw" x1="436" y1="102" x2="528" y2="102" marker-end="url(#cr-arw-n)" />
    <text class="lbl" x="482" y="92" text-anchor="middle">provisions</text>
    <text class="gone-t" x="482" y="120" text-anchor="middle">+ deploys</text>

    <line class="arw-a" x1="696" y1="102" x2="788" y2="102" marker-end="url(#cr-arw)" />
    <text class="lbl" x="742" y="92" text-anchor="middle">managed identity</text>
    <text class="gone-t" x="742" y="120" text-anchor="middle">token, not password</text>

    <text class="sub" x="16" y="206">not stored in the repository, in GitHub Secrets, or in Bicep:</text>

    <rect class="gone" x="16" y="218" width="152" height="32" rx="4" />
    <text class="gone-t" x="92" y="238" text-anchor="middle">client secret</text>
    <line class="strike" x1="30" y1="234" x2="154" y2="234" />

    <rect class="gone" x="182" y="218" width="164" height="32" rx="4" />
    <text class="gone-t" x="264" y="238" text-anchor="middle">publish profile</text>
    <line class="strike" x1="196" y1="234" x2="332" y2="234" />

    <rect class="gone" x="360" y="218" width="204" height="32" rx="4" />
    <text class="gone-t" x="462" y="238" text-anchor="middle">SQL admin password</text>
    <line class="strike" x1="374" y1="234" x2="550" y2="234" />

    <text class="sub" x="584" y="238">GitHub holds only non-secret IDs</text>
  </g>

  <text class="foot" x="28" y="364">Azure SQL is provisioned with azureADOnlyAuthentication: true — the password does not exist to be stolen</text>
</svg>

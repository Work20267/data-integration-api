# One-command local stack:  docker compose up
# Needs only Git and Docker on the machine - no .NET SDK required.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Microsoft publishes no arm64 image for SQL Server, so on Apple Silicon this
    # runs emulated. Stating the platform explicitly turns a confusing runtime
    # failure into Docker simply using emulation; it is a no-op on amd64 hosts.
    # Enable "Use Rosetta for x86_64/amd64 emulation" in Docker Desktop for a
    # large speed-up. See docs/setup.md.
    platform: linux/amd64
    container_name: di-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_P@ss1"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # The api container waits on this, so it never starts before SQL accepts queries.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: di-api
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      # SA auth is for local development only. In Azure the App Service connects
      # as a managed identity and this connection string has no credential at all.
      ConnectionStrings__Default: "Server=sql,1433;Initial Catalog=DataIntegration;User Id=sa;Password=Local_Dev_P@ss1;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;"
    ports:
      - "8080:8080"

volumes:
  sqldata:
